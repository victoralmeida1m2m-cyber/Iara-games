<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Vila da Iara</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--panel:#fff4dc;--ink:#3b2a2a;--accent:#d9548a;--line:#8a5a3b;--sky1:#ffd9a0;--sky2:#f2a0b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#2d2438;--ink:#ffeedd;--line:#c9a0d8;--sky1:#3a2b5c;--sky2:#8a4a7a}}
:root[data-theme="dark"]{--panel:#2d2438;--ink:#ffeedd;--line:#c9a0d8;--sky1:#3a2b5c;--sky2:#8a4a7a}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));font-family:'Press Start 2P',ui-monospace,Menlo,monospace;color:var(--ink);font-size:11px;line-height:1.7}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
.px{background:var(--panel);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#cnt{padding:8px 10px;font-size:10px}
.chip{font:inherit;font-size:9px;padding:8px 9px;cursor:pointer;color:var(--ink)}
.chip.ok{background:#bfe8a6;color:#2b3b2b}
#dlg{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center}
#dlg .px{width:min(640px,100%);padding:14px}
#who{font-size:10px;color:var(--accent);margin-bottom:6px}
#txt{min-height:3.4em}
#opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:10px;padding:10px 12px;background:var(--accent);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer}
button:active{transform:translate(2px,2px)}
button:focus-visible{outline:3px solid #ffcf5c;outline-offset:2px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,20,50,.5)}
[hidden]{display:none!important}
.card{padding:22px;max-width:420px;width:100%;text-align:center}
h1{font-size:20px;line-height:1.5;margin:0 0 12px;color:var(--accent);text-shadow:2px 2px 0 var(--ink)}
.ticket p{display:flex;justify-content:space-between;gap:8px;margin:6px 0;border-bottom:2px dashed var(--line);padding-bottom:6px;text-align:left}
.ticket .btn{margin:6px 4px 0}
.pt{position:fixed;top:-30px;font-size:18px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden><div id="cnt" class="px">🌸 0/4</div></div>
<div id="dlg" hidden><div class="px"><div id="who">Vic, guardião da vila</div><div id="txt"></div><div id="opts"></div></div></div>
<div id="title" class="ov"><div class="px card"><h1>A Vila da Iara</h1><p>Um jogo feito com carinho pra você.</p><button class="btn" id="go">Começar</button></div></div>
<div id="tk" class="ov" hidden><div class="px card ticket"><h1>🎬 Convite</h1>
<p><span>Para</span><b id="t0"></b></p><p><span>Filme</span><b id="t1"></b></p><p><span>Data</span><b id="t2"></b></p><p><span>Horário</span><b id="t3"></b></p><p><span>Cinema</span><b id="t4"></b></p>
<p style="border:0;display:block;text-align:center;margin-top:14px">Você aceita esse date?</p>
<div id="ans"><button class="btn" data-a>Aceito! 💚</button><button class="btn" data-a>Com certeza!</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Edite aqui os dados do convite
const CONFIG={nome:'Iara',filme:'A definir',data:'06/10/2026',hora:'A definir',cinema:'Cinépolis',segredo:'Aqui é o JV do futuro e você é uma ótima namorada.'};
const S={
casa:{n:'🏡 Casinha',q:[
{t:'Dia de preguiça total. Qual é o plano?',o:['Série debaixo do cobertor','Comida e sofá','Dormir até a tarde'],r:'Plano perfeito. Aprovado pelo conselho da vila.'},
{t:'Qual a melhor invenção da humanidade?',o:['Cobertor','Delivery','Botão de soneca'],r:'Debate encerrado. Todas estão certas.'}]},
jardim:{n:'🌻 Jardim',q:[
{t:'Se você fosse uma flor, qual seria?',o:['Girassol','Lavanda','Cacto (flor é bônus)'],r:'Combina demais com você. A vila anotou.'},
{t:'Escolha um clima:',o:['Chuva com café','Sol com sorvete','Noite com estrelas'],r:'Ótima escolha. O jardim concorda.'}]},
cafe:{n:'☕ Café',q:[
{t:'Qual é o seu pedido no café?',o:['Cappuccino','Chocolate quente','Suco gelado'],r:'Pedido anotado. Sai já!'},
{t:'Qual bicho da fazenda você seria?',o:['Gato preguiçoso','Pintinho','Vaca fofa'],r:'Muito fofo. A fazenda aceita.'}]},
lago:{n:'🎣 Lago',q:[
{t:'Qual comida você defenderia no tribunal?',o:['Pizza','Brigadeiro','Lanche'],r:'A defesa venceu por unanimidade.'},
{t:'Escolha um superpoder:',o:['Teletransporte','Pausar o tempo','Ler mentes'],r:'Poder anotado. Use com responsabilidade.'}]},
cine:{n:'🎬 Cinema'}};
const $=s=>document.querySelector(s);
const cv=$('#c'),R=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:false});
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,100);
scene.add(new THREE.AmbientLight(0xffffff,.7));
const sun=new THREE.DirectionalLight(0xfff0d0,.8);sun.position.set(6,10,4);scene.add(sun);
function rs(){const W=innerWidth,H=innerHeight,s=Math.max(3,Math.round(Math.min(W,H)/170));R.setSize(Math.ceil(W/s),Math.ceil(H/s),false);const a=W/H,v=Math.max(8.5,11.5/a);cam.left=-v*a;cam.right=v*a;cam.top=v;cam.bottom=-v;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
const box=(w,h,d,c,x,y,z,p)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);(p||scene).add(m);return m};
const roof=(c,r,h,y,p)=>{const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,4),new THREE.MeshLambertMaterial({color:c}));m.rotation.y=Math.PI/4;m.position.y=y;p.add(m)};
const grp=(id,x,z)=>{const g=new THREE.Group();g.position.set(x,0,z);g.userData.id=id;scene.add(g);return g};
box(17,1,17,'#7bb661',0,-.5,0);box(17,1.6,17,'#8a5a3b',0,-1.8,0);
const tree=(x,z)=>{box(.4,1.2,.4,'#7a4e2d',x,.6,z);box(1.6,1.4,1.6,'#4f9d4a',x,1.9,z);box(1,.8,1,'#63b25a',x,2.9,z)};
[[-7,0],[7,-1],[-1,-7],[1,7],[-7,-6.5],[7,6.5],[6.5,-7],[-7,6.8]].forEach(p=>tree(...p));
const G={};
let g=G.casa=grp('casa',-4.5,-3.5);
box(3,2,3,'#f3d9a4',0,1,0,g);roof('#d9534f',2.6,1.4,2.7,g);box(.7,1.1,.1,'#8a5a3b',0,.55,1.52,g);box(.5,1,.5,'#9a9a9a',.9,3,-.6,g);
g=G.jardim=grp('jardim',3.5,-4);box(4,.2,3,'#6b4428',0,.1,0,g);box(4.2,.5,.15,'#c9a36b',0,.25,1.6,g);
g=G.cafe=grp('cafe',-4.5,3.5);box(3,1.8,2.6,'#c98b5a',0,.9,0,g);box(3.4,.3,1.2,'#ff7eb6',0,1.9,1.5,g);box(1,.6,.1,'#fff4dc',0,1.2,1.32,g);
g=G.lago=grp('lago',3.5,3.5);
const lk=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,.12,10),new THREE.MeshLambertMaterial({color:'#5bb8e8'}));lk.position.y=.06;g.add(lk);
box(.5,.05,.5,'#3f8f3a',-.8,.14,.5,g);box(.5,.4,.5,'#ffd84a',.6,.3,-.3,g);box(.25,.12,.2,'#ff9a3c',.6,.28,.1,g);
g=G.cine=grp('cine',0,0);
box(3.6,3.2,2.8,'#4a3a6b',0,1.6,0,g);box(3.8,.3,3,'#2e2347',0,3.35,0,g);box(1.3,.05,1.8,'#d9534f',0,.03,2.3,g);
const mq=box(3,.6,.2,'#777',0,2.5,1.5,g),dr=box(1,1.4,.1,'#2a2236',0,.7,1.42,g);
mq.material=new THREE.MeshBasicMaterial({color:'#777'});
const ff=[];for(let i=0;i<10;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:'#fff2a0'}));m.userData={x:Math.random()*14-7,z:Math.random()*14-7,p:Math.random()*6};scene.add(m);ff.push(m)}
const grow=[],done={};let open=false;
function flower(id){const f=new THREE.Group(),c=['#ff7eb6','#ffd84a','#b48cff','#ff9a5c'][Object.keys(done).length%4];
box(.15,.9,.15,'#3f8f3a',0,.45,0,f);box(.55,.55,.55,c,0,1.1,0,f);box(.2,.2,.2,'#fff',0,1.1,.3,f);
f.position.set(id==='jardim'?0:1.9,id==='jardim'?.2:0,id==='jardim'?0:1.9);f.scale.setScalar(.01);G[id].add(f);grow.push(f)}
let ang=.8,T=0;const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
(function loop(){requestAnimationFrame(loop);T+=.016;if(!calm)ang+=.0015;
cam.position.set(Math.cos(ang)*14,10,Math.sin(ang)*14);cam.lookAt(0,1,0);
grow.forEach(f=>{if(f.scale.x<1)f.scale.setScalar(Math.min(1,f.scale.x+.03))});
ff.forEach(m=>{const u=m.userData;m.position.set(u.x+Math.sin(T+u.p),1.2+Math.sin(T*1.5+u.p)*.6,u.z+Math.cos(T+u.p))});
if(open)mq.material.color.setHSL(.12,1,.55+.1*Math.sin(T*4));
R.render(scene,cam)})();
// Dialogo
let ac,tm;
const blip=()=>{if(!ac)return;const o=ac.createOscillator(),v=ac.createGain();o.type='square';o.frequency.value=480+Math.random()*120;v.gain.value=.03;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.04)};
let busy=false;
function close(){$('#dlg').hidden=true;busy=false}
function talk(text,opts,next){busy=true;$('#dlg').hidden=false;const o=$('#opts');o.innerHTML='';
if(!opts.length)opts=[['Continuar',next||close]];
let i=0;clearInterval(tm);tm=setInterval(()=>{$('#txt').textContent=text.slice(0,++i);if(i%3==1)blip();
if(i>=text.length){clearInterval(tm);opts.forEach(([l,fn])=>{const b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=fn;o.appendChild(b)});o.firstChild.focus()}},26)}
function ask(id,i){const q=S[id].q[i];talk(q.t,q.o.map(l=>[l,()=>talk(q.r,[],()=>i+1<S[id].q.length?ask(id,i+1):finish(id))]))}
function finish(id){done[id]=1;flower(id);const n=Object.keys(done).length;$('#cnt').textContent='🌸 '+n+'/4';document.querySelector('[data-id='+id+']').classList.add('ok');
if(n==4){open=true;mq.material.color.set('#ffcf5c');dr.material.color.set('#ffe9a8');talk('Você juntou as 4 flores! As luzes do cinema acenderam. Toque nele!',[])}
else talk('Você ganhou uma flor! 🌸 Faltam '+(4-n)+'.',[])}
function visit(id){if(busy)return;
if(id==='cine'){if(!open)return talk('A porta do cinema está trancada. Junte as 4 flores da vila para abrir!',[]);return showTicket()}
if(done[id])return talk('Você já passou por aqui. Explore outro cantinho!',[]);ask(id,0)}
function showTicket(){busy=true;['nome','filme','data','hora','cinema'].forEach((k,i)=>$('#t'+i).textContent=CONFIG[k]);$('#tk').hidden=false}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
const n=matchMedia('(prefers-reduced-motion:reduce)').matches?10:40;
for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pt';s.textContent=['🌸','🍿','💚'][i%3];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2+Math.random()*2.5)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),5000)}
$('#ans').innerHTML='<p style="margin:10px 0">Combinado! 💚 Prepara a pipoca.</p><button class="btn" id="sec">💌 Mensagem secreta</button>';
$('#sec').onclick=()=>{$('#ans').innerHTML='<p style="margin:10px 0;line-height:1.9">💌 '+CONFIG.segredo+'</p>'}});
// HUD
Object.keys(S).forEach(id=>{const b=document.createElement('button');b.className='chip px';b.dataset.id=id;b.textContent=S[id].n;b.onclick=()=>visit(id);$('#hud').appendChild(b)});
// Clique no mapa
const rc=new THREE.Raycaster();
cv.addEventListener('pointerdown',e=>{if(busy)return;rc.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
const h=rc.intersectObjects(scene.children,true)[0];if(!h)return;let o=h.object;while(o&&!o.userData.id)o=o.parent;if(o)visit(o.userData.id)});
$('#go').onclick=()=>{try{ac=new AudioContext()}catch(e){}$('#title').hidden=true;$('#hud').hidden=false;
talk('Oi, '+CONFIG.nome+'! Eu sou o Vic, guardião da vila. Visite os 4 cantinhos, responda as perguntas e junte flores. Toque num lugar do mapa!',[])};
</script>
</body>
</html>
